name: PR Alpha APK

# Isolated testing only: no release environments, production signing keys, or
# publication rights. The APK gets a distinct application ID, so it cannot
# overwrite the official WebLibre Alpha installation.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr-alpha-apk.yml'
      - '.github/workflows/actions.lock'
      - 'apps/weblibre/lib/**'
      - 'apps/weblibre/android/**'
      - 'apps/weblibre/pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/**'

permissions: {}

concurrency:
  group: pr-alpha-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build isolated ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: false

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          ANDROID_NDK_VERSION="$(
            awk -F= '$1 == "weblibre.ndkVersion" { print $2 }' \
              apps/weblibre/android/gradle.properties
          )"
          test -n "$ANDROID_NDK_VERSION"
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          test "$sdkmanager_status" -eq 0
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          {
            echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          dart pub global activate melos 7.8.1
          melos bootstrap
          python3 scripts/merge_l10n_arb.py --check

      - name: Prepare checked-in external assets
        run: |
          set -euo pipefail
          melos run update-assets --no-select
          melos run build-components --no-select

      - name: Checkout pinned native dependencies
        run: |
          set -euo pipefail
          source native/go_mobile_runtime/pins.env
          git clone https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          git -C "$RUNNER_TEMP/sing-box" checkout "$SING_BOX_TAG"
          test "$(git -C "$RUNNER_TEMP/sing-box" rev-parse HEAD)" = "$SING_BOX_COMMIT"
          git clone https://github.com/tladesignz/IPtProxy.git "$RUNNER_TEMP/IPtProxy"
          git -C "$RUNNER_TEMP/IPtProxy" checkout "$IPTPROXY_TAG"
          test "$(git -C "$RUNNER_TEMP/IPtProxy" rev-parse HEAD)" = "$IPTPROXY_COMMIT"
          git -C "$RUNNER_TEMP/IPtProxy" submodule update --init dnstt

      - name: Build native gomobile runtime
        env:
          SING_BOX_SOURCE: ${{ runner.temp }}/sing-box
          IPTPROXY_SOURCE: ${{ runner.temp }}/IPtProxy
        run: melos run build-go-runtime --no-select

      - name: Give preview an independent Android app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/weblibre/android/app/build.gradle')
          original = p.read_text()
          old = 'applicationIdSuffix ".alpha"'
          assert original.count(old) == 2, 'Alpha flavor declarations changed'
          modified = original.replace(old, 'applicationIdSuffix ".alpha.pr"')
          modified = modified.replace('appName: "WebLibre Alpha"', 'appName: "WebLibre PR Preview"')
          p.write_text(modified)
          PY

      - name: Create disposable build signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/preview-key.jks" -storetype JKS \
            -alias preview -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=WebLibre PR Preview" \
            -storepass "$password" -keypass "$password"
          {
            echo "KEY_PATH=$RUNNER_TEMP/preview-key.jks"
            echo "KEY_ALIAS=preview"
            echo "KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build release-optimized ARM64 preview
        working-directory: apps/weblibre
        run: flutter build apk --release --flavor githubAlpha --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Verify APK and prepare artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(apps/weblibre/build/app/outputs/apk/githubAlpha/release/*.apk)
          test "${#apks[@]}" -eq 1
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "${apks[0]}"
          mkdir -p "$RUNNER_TEMP/preview-apk"
          cp "${apks[0]}" "$RUNNER_TEMP/preview-apk/WebLibre-PR-${PR_NUMBER}-arm64.apk"
          sha256sum "$RUNNER_TEMP"/preview-apk/*.apk

      - name: Delete disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/preview-key.jks"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: weblibre-pr-arm64
          path: ${{ runner.temp }}/preview-apk/*.apk
          retention-days: 7
          if-no-files-found: error
