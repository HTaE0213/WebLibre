name: Feature validation

# PR-only checks for browser feature changes. Never releases or signs with
# production credentials. The v* release workflow stays separate.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/feature-validation.yml'
      - '.github/workflows/actions.lock'
      - 'apps/weblibre/lib/**'
      - 'apps/weblibre/test/**'
      - 'apps/weblibre/pubspec.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter feature integration checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: false

      - name: Resolve workspace dependencies
        run: |
          set -euo pipefail
          dart pub global activate melos 7.8.1
          melos bootstrap

      - name: Check localization template
        run: python3 scripts/merge_l10n_arb.py --check

      - name: Verify Dart formatting
        run: |
          dart format \
            apps/weblibre/lib/features/addons/presentation/screens/addon_details.dart \
            apps/weblibre/lib/features/addons/presentation/widgets/pinned_addon_bar.dart \
            apps/weblibre/lib/features/browser_actions/domain/services/browser_action_dispatcher.dart \
            apps/weblibre/lib/features/geckoview/domain/repositories/tab.dart \
            apps/weblibre/lib/features/geckoview/features/browser/features/contextual_toolbar \
            apps/weblibre/lib/features/geckoview/features/browser/presentation/widgets/browser_modules/bottom_app_bar.dart \
            apps/weblibre/lib/features/settings/presentation/screens/contextual_toolbar_settings.dart \
            apps/weblibre/test/features/geckoview/features/contextual_toolbar

      - name: Check new-tab route and web search formatting
        run: |
          dart format \
            apps/weblibre/lib/core/routing/routes.browser.dart \
            apps/weblibre/lib/core/routing/routes.g.dart \
            apps/weblibre/lib/features/geckoview/features/search/presentation/screens/search.dart \
            apps/weblibre/lib/features/web_search/presentation/open_in_new_tab.dart \
            apps/weblibre/test/features/geckoview/features/browser/new_tab_target_test.dart

          # Print the canonical formatting diff when any checked-in Dart source
          # is not formatted, rather than only reporting a filename.
          git diff --exit-code -- apps/weblibre/lib/features apps/weblibre/lib/core/routing apps/weblibre/test

      - name: Analyze changed Flutter feature code
        working-directory: apps/weblibre
        run: |
          flutter analyze --no-pub \
            lib/features/addons/presentation/screens/addon_details.dart \
            lib/features/addons/presentation/widgets/pinned_addon_bar.dart \
            lib/features/browser_actions/domain/services/browser_action_dispatcher.dart \
            lib/features/geckoview/domain/repositories/tab.dart \
            lib/features/geckoview/features/browser/features/contextual_toolbar \
            lib/features/geckoview/features/browser/presentation/widgets/browser_modules/bottom_app_bar.dart \
            lib/features/settings/presentation/screens/contextual_toolbar_settings.dart \
            test/features/geckoview/features/contextual_toolbar

          git diff --exit-code -- apps/weblibre/lib/features apps/weblibre/lib/core/routing apps/weblibre/test

      - name: Analyze selection-safe page gesture service
        run: |
          cd apps/weblibre
          flutter analyze --no-pub lib/features/gestures/domain/services/gesture_control.dart

      - name: Verify Home/New Tab settings and creation entry points
        run: |
          cd apps/weblibre
          flutter analyze --no-pub \
            lib/features/geckoview/features/browser/domain/entities/home_target.dart \
            lib/features/user/data/models/general_settings.dart \
            lib/features/settings/presentation/screens/home_settings.dart \
            lib/features/geckoview/features/browser/presentation/widgets/tab_creation_menu.dart \
            lib/features/geckoview/features/browser/presentation/screens/tab_view.dart \
            lib/features/geckoview/features/browser/presentation/widgets/tab_view/tab_tray_new_tab_fab.dart \
            lib/features/geckoview/features/browser/presentation/widgets/browser_modules/browser_view.dart \
            lib/core/routing/routes.browser.dart \
            lib/features/geckoview/features/search/presentation/screens/search.dart \
            lib/features/web_search/presentation/open_in_new_tab.dart \
            test/features/geckoview/features/browser/new_tab_target_test.dart
          flutter test --no-pub test/features/geckoview/features/browser/new_tab_target_test.dart

      - name: Run gesture unit/widget tests
        working-directory: apps/weblibre
        run: |
          flutter test --no-pub \
            test/features/geckoview/features/contextual_toolbar/toolbar_button_gesture_bindings_test.dart \
            test/features/geckoview/features/contextual_toolbar/toolbar_button_gesture_surface_test.dart
